# opencode — the agent framework Harness2 also runs as a substrate.
#
# NOTE the key is `provider` (singular). The file at ~/.config/opencode uses the
# newer `providers` key, which OpenCode v1.14.18 — the version Harness2 pins —
# rejects outright ("Unrecognized key"). Harness2's own runs point
# XDG_CONFIG_HOME at dependencies/opencode-config, so they never read this file.

id = "opencode"
label = "opencode (desktop config)"
config_path = "~/.config/opencode/opencode.json"
config_format = "opencode-provider"
adapter = "opencode"
key_name = "opencode_desktop"

binary = "opencode"
# `--format json` is not decorative: without it the run's closing text is written
# as bare prose, and both readers here (`_final_text`, `render_events`) parse the
# event stream instead -- so a conversational task that answered correctly was
# reported as having produced no output. The JobBench runner passes the same flag.
headless = ["run", "{prompt}", "--format", "json"]
model_flag = "--model"
# `opencode run --continue` continues the last session in this directory.
continue_flag = "--continue"
trace_glob = "~/.local/share/opencode/log/*.log"
skills_dir = "~/.config/opencode/skill"

# Group assignment: opencode gets the frontier Claude group.
allowed_models = [
    "claude-sonnet-4-6",
    "claude-opus-4-6",
    "claude-haiku-4-5",
    "claude-sonnet-4-5",
    "claude-opus-4-5",
    "claude-opus-4-7",
]

# Routing: opencode is the general-purpose interactive agent here.
routes = ["plan", "design", "architect", "document", "docs", "explain", "review"]
# `--model` takes OpenCode's `provider/model` form, so the default carries the
# gateway prefix. A bare id fails with `Model not found: claude-sonnet-4-6/.`;
# harnesses that name a model directly (claude-code) take it bare instead, which
# is why this lives in the manifest rather than in the shared resolver.
default_model = "9router/claude-sonnet-4-6"
priority = 5
