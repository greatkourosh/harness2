# claude code — the `claude` CLI, which can point at any Anthropic-compatible
# endpoint through its settings `env` block. 9router speaks the Anthropic
# Messages protocol at /v1/messages, so the CLI reaches it the same way it
# would reach the real API.
#
# CAUTION: this file is shared with claude desktop (see claude-desktop.toml).
# Both processes read ~/.claude/settings.json, so an `apply` here also changes
# what the desktop app's Code sessions use. That is intended — they are the
# same Anthropic config surface — but it is the reason they are separate
# manifests with separate model groups rather than one entry.

id = "claude-code"
label = "claude code (CLI)"
config_path = "~/.claude/settings.json"
config_format = "claude-settings"
adapter = "claude-code"
key_name = "claude_code_cli"

binary = "claude"
# `--permission-mode auto` is required headlessly, NOT `acceptEdits`. Measured:
# under acceptEdits the agent is denied every command outside a small safe-command
# allowlist -- `echo` passes, `python3 -c`, `unzip -l`, `pandoc` and `awk` do not
# (0 allowed / 1 denied on a three-command probe; auto: 3/3). LAB cannot work that
# way, because reading a binary document IS `python3 scripts/read_doc.py <path>`.
# A real rollout spent its whole 5400s wall on 322 such denials and delivered only
# a scratch file. `auto` lets Bash run while still classifying each command, and
# unlike `bypassPermissions` it keeps the classifier in the loop; the workspace is
# a per-run scratch dir, which is the posture the codex cell already takes
# (it runs `codex exec --dangerously-bypass-approvals-and-sandbox`).
#
# `--output-format stream-json` (which requires `--verbose` under --print) turns
# the prose into one JSON event per line, so the capture stream carries structure
# the shared renderer and the runner's parse_session can read -- without it the
# trajectory renders as "(no parseable events in trajectory)" and turn/token
# metrics are absent. Both `harness2-harness bench` and the LAB runner capture
# that stream to <harness>_session.jsonl, so the structure lands on disk rather
# than the terminal.
headless = [
  "-p", "{prompt}",
  "--permission-mode", "auto",
  "--output-format", "stream-json",
  "--verbose",
]
model_flag = "--model"
# Resumes the previous conversation in the same working directory, which is what
# lets a panel task continue an earlier one instead of starting cold.
continue_flag = "--continue"
trace_glob = "~/.claude/projects/**/*.jsonl"
skills_dir = "~/.claude/skills"

# Group assignment: claude code gets the frontier Claude group.
allowed_models = ["claude-sonnet-4-6", "claude-opus-4-6", "claude-haiku-4-5"]

# Routing: the default, and the one for heavy written deliverables.
routes = ["memo", "report", "legal", "contract", "analysis", "summarize", "docx"]
default_model = "claude-sonnet-4-6"
priority = 20
default = true
